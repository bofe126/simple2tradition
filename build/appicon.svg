<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#2B5CD9"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D0A6"/>
      <stop offset="100%" stop-color="#1BA37F"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- diagonal split -->
    <path d="M 924 100 L 924 924 L 100 924 Z" fill="url(#bg2)"/>
    <!-- subtle divider line -->
    <line x1="924" y1="100" x2="100" y2="924" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8"/>
    <!-- soft highlight -->
    <ellipse cx="380" cy="180" rx="520" ry="260" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- 简 (top-left) -->
  <text x="330" y="430" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-weight="600"
        font-size="290" fill="#ffffff" text-anchor="middle">简</text>

  <!-- 繁 (bottom-right) -->
  <text x="695" y="840" font-family="PingFang TC, Hiragino Sans CNS, PingFang SC, sans-serif" font-weight="600"
        font-size="290" fill="#ffffff" text-anchor="middle">繁</text>

  <!-- swap arrows in center -->
  <g transform="translate(560,470)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M -58 -22 H 58 l -32 -32"/>
    <path d="M 58 22 H -58 l 32 32"/>
  </g>
</svg>
